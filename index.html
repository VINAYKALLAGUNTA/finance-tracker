<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Daily Finance Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="title" id="appTitle">Daily Finance</div>
  <select id="memberSel" aria-label="Member" hidden></select>
  <button id="langBtn" aria-label="Language">తె</button>
</header>
<main id="view" aria-live="polite"></main>

<button id="fab" aria-label="Add transaction">+</button>

<nav id="nav" aria-label="Sections"></nav>

<div id="scrim"></div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sh"><b id="sheetTitle"></b><button class="icon" data-act="close-sheet" aria-label="Close">✕</button></div>
  <div class="voice" id="voiceRow">
    <button type="button" class="mic" id="mic" data-act="voice" aria-label="Voice entry">🎤</button>
    <select id="vLang" aria-label="Voice language"><option value="en-IN">English</option><option value="te-IN">తెలుగు</option></select>
    <div class="say" id="voiceTxt"></div>
  </div>
  <div id="seg"></div>
  <form id="addForm" class="form" autocomplete="off">
    <label id="amountWrap"><span data-i="amount"></span><input id="fAmount" inputmode="decimal" placeholder="0" required></label>
    <label id="rowKind" hidden><span data-i="what_happened"></span><select id="fKind"></select></label>
    <label id="rowPerson" hidden><span data-i="person"></span><select id="fPerson"></select></label>
    <label id="rowNewPerson" hidden><span data-i="new_person_name"></span><input id="fNewPerson" maxlength="40"></label>
    <label id="lblAcc"><span id="lblAccTxt"></span><select id="fAcc"></select></label>
    <label id="rowTo" hidden><span data-i="to_account"></span><select id="fTo"></select></label>
    <label id="rowCat"><span data-i="category"></span><select id="fCat"></select></label>
    <label><span data-i="date"></span><input id="fDate" type="date" required></label>
    <label><span data-i="note_opt"></span><input id="fNote" maxlength="120"></label>
    <div class="photo">
      <label class="file"><span data-i="receipt_photo"></span><input id="fPhoto" type="file" accept="image/*" capture="environment"></label>
      <img id="photoPrev" alt="" hidden>
      <button type="button" class="link" id="photoRm" data-act="photo-rm" hidden></button>
    </div>
    <button class="primary" type="submit" id="saveBtn"></button>
  </form>
</div>

<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<div id="printArea"></div>

<script src="logic.js"></script>
<script src="parsers.js"></script>
<script src="xlsx.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
